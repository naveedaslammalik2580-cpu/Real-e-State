name: tests

# The whole suite is offline by design - tests/helpers/hooks.mjs refuses
# every remote import except the Supabase client stub, and no test ever
# reaches Supabase, Resend or any network service. So this workflow needs
# no secrets, and must never be given any.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The SQL tests build a real Postgres (PGlite, in WebAssembly) and
    # replay every migration into it. That is minutes, not seconds, and a
    # job that is killed at the default six hours tells nobody anything -
    # 40 means a hang is reported as a hang.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The migrated-database snapshot. Rebuilding it is the slowest thing
      # in the suite, and it only changes when a migration does - hence the
      # key. tests/helpers/pg.mjs rebuilds it by itself on a miss, so a
      # stale or absent cache costs time and nothing else.
      - name: Cache the migrated database snapshot
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: pglite-${{ runner.os }}-${{ hashFiles('supabase/migrations/**') }}
          restore-keys: |
            pglite-${{ runner.os }}-

      - name: Install
        working-directory: tests
        run: npm ci

      - name: Run the suite
        working-directory: tests
        run: npm run test:quiet
